name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.scope.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify the exact event comparison
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/change_scope.py

  package-and-docs:
    needs: change-scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.change-scope.outputs.lane == 'product'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.12"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.18"

      - name: Sync the locked project
        run: |
          uv lock --check
          uv sync --locked

      - name: Verify package version contract
        env:
          TARGET_LINE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          case "$TARGET_LINE" in
            develop|main) line="$TARGET_LINE" ;;
            *) line=any ;;
          esac
          uv run --locked python scripts/check_version.py --line "$line"

      - name: Verify the public package surface
        run: |
          uv run --locked python - <<'PY'
          import inspect
          from importlib.metadata import version

          import scnsim
          from scnsim import (
              CircuitPlan,
              Library,
              components,
          )

          assert scnsim.__version__ == version("scnsim")
          assert "components" in scnsim.__all__
          assert "library" not in scnsim.__all__
          assert not hasattr(scnsim, "library")
          assert isinstance(components, Library)
          assert components is scnsim.components
          assert inspect.getdoc(Library)
          assert inspect.signature(components.capacitor).return_annotation == "ComponentInstance"
          assert inspect.signature(CircuitPlan).parameters["id"].kind.name == "KEYWORD_ONLY"
          assert inspect.getdoc(CircuitPlan)
          print(scnsim.__version__)
          PY

      - name: Discover the current purpose-based unittest suite
        run: >-
          uv run --locked --group course-generation python -m unittest discover -s tests -t . -v

      - name: Record convergence validation scope
        run: |
          echo "### Test coverage in this job" >> "$GITHUB_STEP_SUMMARY"
          echo "This job and each installed-wheel runtime job discover the current purpose-based JAX unittest suite. Job results report actual failures; skips are not treated as passes." >> "$GITHUB_STEP_SUMMARY"

      - name: Build and inspect the wheel
        run: |
          uv build --no-sources
          uv run --locked python - <<'PY'
          import glob
          import zipfile

          wheels = glob.glob("dist/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
          assert "scnsim/py.typed" in names
          assert "scnsim/_native/compensated_cpu.cpp" in names
          assert not any(name.startswith("scnsim/_julia/") for name in names), names
          assert any(name.endswith("/licenses/LICENSE") for name in names)
          assert any(name.endswith("/licenses/NOTICE") for name in names)
          PY
          uv venv --clear --python 3.12 .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl
          .venv-wheel/bin/python - <<'PY'
          from importlib.metadata import version

          import scnsim

          assert scnsim.__version__ == version("scnsim")
          print(scnsim.__version__)
          PY

      - name: Verify portable wheel identity and minimum Python 3.12 import
        run: |
          mkdir -p dist/path-a dist/path-b
          cp dist/*.whl dist/path-a/
          cp dist/*.whl dist/path-b/
          uv venv --clear --python 3.12 .venv-path-a
          uv venv --clear --python 3.12 .venv-path-b
          uv pip install --python .venv-path-a/bin/python dist/path-a/*.whl
          uv pip install --python .venv-path-b/bin/python dist/path-b/*.whl
          uv run --locked python - <<'PY'
          import json
          import subprocess

          probe = r'''
          import json
          from scnsim import CircuitPlan, components, units as u
          from scnsim.canonical import sha256_hex
          from scnsim.authoring.identity import canonical_plan_document
          from scnsim.authoring.provenance import catalog_source_record

          plan = CircuitPlan(id="portable-wheel")
          capacitor = plan.add(components.capacitor(id="c", capacitance=1.0 * u.pF))
          node = plan.bus(id="n")
          plan.branch(id="shunt", at=node, elements=(capacitor,), end=plan.ground)
          plan.add_port(id="p", at=node, role="terminated", reference_impedance=50.0 * u.ohm)
          source = catalog_source_record(components)
          document = canonical_plan_document(plan._capture_authoring_snapshot().semantic_record)
          print(json.dumps([source["source_sha256"], sha256_hex(document)]))
          '''
          values = [
              json.loads(subprocess.check_output([interpreter, "-c", probe], text=True))
              for interpreter in (".venv-path-a/bin/python", ".venv-path-b/bin/python")
          ]
          assert values[0] == values[1], values
          PY
          uv venv --clear --python 3.12 .venv-py312
          uv pip install --python .venv-py312/bin/python dist/*.whl
          .venv-py312/bin/python - <<'PY'
          from importlib.metadata import version

          import scnsim
          assert scnsim.__version__ == version("scnsim")
          PY

      - name: Verify Notebook hygiene
        run: |
          uv run --locked python - <<'PY'
          import json
          import re
          import runpy
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          portable_notebook_bytes = runpy.run_path(
              "scripts/generate_portable_notebook.py"
          )["portable_notebook_bytes"]

          def source_text(value):
              if isinstance(value, list) and all(isinstance(item, str) for item in value):
                  return "".join(value).replace("\r\n", "\n")
              if isinstance(value, str):
                  return value.replace("\r\n", "\n")
              raise AssertionError("cell source must be a string or list of strings")

          def normalized(notebook, label):
              cells = notebook["cells"]
              assert cells, f"empty notebook: {label}"
              first = source_text(cells[0].get("source", ""))
              assert cells[0].get("cell_type") == "markdown", label
              assert not first.lstrip().startswith("---\n"), f"literal YAML: {label}"
              first_line = next((line.strip() for line in first.splitlines() if line.strip()), "")
              assert first_line.startswith("# "), f"missing visible H1: {label}"

              code_ids = []
              normalized_cells = []
              for index, cell in enumerate(cells):
                  assert not cell.get("attachments"), f"attachment: {label}"
                  metadata = dict(cell.get("metadata", {}))
                  metadata.pop("id", None)
                  value = {
                      "cell_type": cell["cell_type"],
                      "source": source_text(cell.get("source", "")),
                      "metadata": metadata,
                  }
                  if cell["cell_type"] == "code":
                      cell_id = cell.get("id")
                      assert isinstance(cell_id, str) and cell_id, f"missing code id: {label}:{index}"
                      assert cell_id not in code_ids, f"duplicate code id: {label}:{cell_id}"
                      code_ids.append(cell_id)
                      value["id"] = cell_id
                      assert cell.get("execution_count") is None, f"executed cell: {label}:{cell_id}"
                      assert cell.get("outputs") == [], f"output cell: {label}:{cell_id}"
                      compile(value["source"], label, "exec")
                  normalized_cells.append(value)

              metadata = notebook.get("metadata", {})
              kernelspec = metadata.get("kernelspec", {})
              assert "path" not in kernelspec, f"machine-local kernel path: {label}"
              language_info = metadata.get("language_info", {})
              relevant_metadata = {
                  "kernelspec": {
                      key: kernelspec[key]
                      for key in ("name", "language")
                      if key in kernelspec
                  },
                  "language_info": {
                      key: language_info[key]
                      for key in ("name",)
                      if key in language_info
                  },
              }
              return {
                  "nbformat": notebook.get("nbformat"),
                  "nbformat_minor": notebook.get("nbformat_minor"),
                  "metadata": relevant_metadata,
                  "cells": normalized_cells,
              }

          def render_fresh(source):
              with tempfile.TemporaryDirectory(prefix="scnsim-reader-ipynb-") as directory:
                  isolated = Path(directory)
                  shutil.copytree(Path("examples"), isolated / "examples")
                  rendered = subprocess.run(
                      [
                          "quarto", "render", str(source), "--to", "ipynb",
                          "--no-execute", "--no-clean", "--output", "-",
                      ],
                      cwd=isolated,
                      check=True,
                      capture_output=True,
                  ).stdout
                  return portable_notebook_bytes(rendered)

          chapter_specs = (
              (
                  Path("examples/engineer/chapter-01/chapter.qmd"),
                  (
                      "_01-build.qmd", "_02-diagram.qmd", "_03-s11.qmd",
                      "_04-root.qmd", "_05-change-capacitance.qmd",
                  ),
                  (
                      "01-build.qmd", "02-diagram.qmd", "03-s11.qmd",
                      "04-root.qmd", "05-change-capacitance.qmd",
                  ),
                  17,
              ),
              (
                  Path("examples/engineer/chapter-02/chapter.qmd"),
                  (
                      "_01-build.qmd", "_02-sweep.qmd", "_03-optimize.qmd",
                      "_04-optional-spaces.qmd",
                  ),
                  (
                      "01-build.qmd", "02-sweep.qmd", "03-optimize.qmd",
                      "04-optional-spaces.qmd",
                  ),
                  18,
              ),
              (
                  Path("examples/engineer/chapter-03/chapter.qmd"),
                  ("_01-build.qmd", "_02-diagram.qmd", "_03-s21.qmd"),
                  ("01-build.qmd", "02-diagram.qmd", "03-s21.qmd"),
                  9,
              ),
              (
                  Path("examples/engineer/chapter-04/chapter.qmd"),
                  (
                      "_01-physical-plan.qmd", "_02-explicit-capstone.qmd",
                      "_03-ptc-core.qmd", "_04-optional-transform.qmd",
                      "_05-optional-quantity.qmd",
                  ),
                  (
                      "01-physical-plan.qmd", "02-explicit-capstone.qmd",
                      "03-ptc-core.qmd", "04-optional-transform.qmd",
                      "05-optional-quantity.qmd",
                  ),
                  9,
              ),
              (
                  Path("examples/engineer/chapter-05/chapter.qmd"),
                  ("_01-library.qmd", "_02-instance.qmd", "_03-reuse.qmd"),
                  ("01-library.qmd", "02-instance.qmd", "03-reuse.qmd"),
                  6,
              ),
              (
                  Path("examples/engineer/chapter-06/chapter.qmd"),
                  ("_01-default.qmd", "_02-port-poses.qmd", "_03-junctions.qmd", "_04-reuse.qmd"),
                  ("01-default.qmd", "02-port-poses.qmd", "03-junctions.qmd", "04-reuse.qmd"),
                  10,
              ),
              (
                  Path("examples/engineer/chapter-07/chapter.qmd"),
                  ("_01-rlgc.qmd", "_02-ports.qmd", "_03-diagrams.qmd", "_04-parameter-points.qmd"),
                  ("01-rlgc.qmd", "02-ports.qmd", "03-diagrams.qmd", "04-parameter-points.qmd"),
                  10,
              ),
              (
                  Path("examples/engineer/chapter-08/chapter.qmd"),
                  ("_01-persist.qmd", "_02-resolve.qmd"),
                  ("01-persist.qmd", "02-resolve.qmd"),
                  7,
              ),
          )
          aggregates = [item[0] for item in chapter_specs]
          sources = aggregates
          notebooks = [path.with_suffix(".ipynb") for path in sources]
          assert all(path.is_file() for path in notebooks), notebooks

          expanded_sources = {}
          for aggregate, fragment_names, wrapper_names, expected_cells in chapter_specs:
              fragments = [aggregate.parent / name for name in fragment_names]
              aggregate_text = aggregate.read_text(encoding="utf-8")
              includes = re.findall(r"\{\{< include ([^ ]+) >\}\}", aggregate_text)
              assert includes == [path.name for path in fragments], includes
              fragment_text = "".join(path.read_text(encoding="utf-8") for path in fragments)
              assert all(not path.read_text(encoding="utf-8").lstrip().startswith("---") for path in fragments)
              aggregate_ids = re.findall(r"(?m)^#\| id:\s*(\S+)\s*$", fragment_text)
              assert len(aggregate_ids) == fragment_text.count("```{python}") == expected_cells
              assert len(aggregate_ids) == len(set(aggregate_ids))
              expanded_sources[aggregate] = fragment_text

              wrappers = [aggregate.parent / name for name in wrapper_names]
              for wrapper, fragment in zip(wrappers, fragments, strict=True):
                  text = wrapper.read_text(encoding="utf-8")
                  frontmatter = text.split("---", 2)[1]
                  assert re.search(r"(?m)^execute:\s*\n[ \t]+enabled:\s*false\s*$", frontmatter)
                  assert re.findall(r"\{\{< include ([^ ]+) >\}\}", text) == [fragment.name]
                  assert not wrapper.with_suffix(".ipynb").exists()

          for source, artifact in zip(sources, notebooks):
              qmd = source.read_text(encoding="utf-8")
              frontmatter = qmd.split("---", 2)[1]
              assert re.search(r"(?m)^jupyter:\s*python3\s*$", frontmatter), source
              assert re.search(
                  r"(?m)^execute:\s*\n[ \t]+enabled:\s*false\s*$",
                  frontmatter,
              ), source
              expanded = expanded_sources.get(source, qmd)
              code_chunks = expanded.count("```{python}")
              declared_ids = re.findall(r"(?m)^#\| id:\s*(\S+)\s*$", expanded)
              assert len(declared_ids) == code_chunks, f"missing QMD code id: {source}"
              assert len(declared_ids) == len(set(declared_ids)), f"duplicate QMD code id: {source}"

              distributed_bytes = artifact.read_bytes()
              artifact_stat = artifact.stat()
              artifact_identity = (
                  artifact_stat.st_dev,
                  artifact_stat.st_ino,
                  artifact_stat.st_size,
                  artifact_stat.st_mtime_ns,
              )
              rendered = render_fresh(source)

              current_stat = artifact.stat()
              current_identity = (
                  current_stat.st_dev,
                  current_stat.st_ino,
                  current_stat.st_size,
                  current_stat.st_mtime_ns,
              )
              assert current_identity == artifact_identity, f"notebook identity changed: {artifact}"
              assert artifact.read_bytes() == distributed_bytes, f"notebook bytes changed: {artifact}"
              fresh = json.loads(rendered)
              distributed = json.loads(distributed_bytes)
              portable_kernelspec_keys = {"display_name", "language", "name"}
              distributed_kernelspec = distributed.get("metadata", {}).get("kernelspec", {})
              assert set(distributed_kernelspec) <= portable_kernelspec_keys, (
                  f"non-portable kernelspec metadata: {artifact}: "
                  f"{sorted(set(distributed_kernelspec) - portable_kernelspec_keys)}"
              )
              assert normalized(distributed, str(artifact)) == normalized(
                  fresh, f"fresh render of {source}"
              ), f"generated notebook drift: {artifact}"

          print("verified", len(aggregates), "expanded Chapter aggregates")
          PY

      - name: Verify source-bound Tutorial figures without executing them
        run: |
          uv run --locked python scripts/generate_engineer_chapter1.py --check
          uv run --locked python scripts/generate_engineer_chapter2.py --check
          uv run --locked python scripts/generate_engineer_chapter3.py --check
          uv run --locked python scripts/generate_engineer_chapter4.py --check
          uv run --locked python scripts/generate_engineer_chapter5.py --check
          uv run --locked python scripts/generate_engineer_chapter6.py --check
          uv run --locked python scripts/generate_engineer_chapter7.py --check
          uv run --locked python scripts/generate_engineer_chapter8.py --check

      - name: Render and inspect documentation
        run: |
          quarto render --no-execute --no-clean
          uv run --locked python - <<'PY'
          import re
          from pathlib import Path

          import subprocess

          tracked = subprocess.check_output(
              ["git", "ls-files", "*.md", "*.qmd"],
              text=True,
          ).splitlines()

          def prose_only(text):
              lines = []
              fence_char = None
              fence_length = 0
              for line in text.splitlines():
                  marker = re.match(r"^ {0,3}(`{3,}|~{3,})(.*)$", line)
                  if fence_char is None:
                      if marker:
                          fence_char = marker.group(1)[0]
                          fence_length = len(marker.group(1))
                      else:
                          lines.append(line)
                  elif (
                      marker
                      and marker.group(1)[0] == fence_char
                      and len(marker.group(1)) >= fence_length
                      and not marker.group(2).strip()
                  ):
                      fence_char = None
              return "\n".join(lines)

          include_contexts = {}
          for source in map(Path, tracked):
              for included in re.findall(r"\{\{<\s*include\s+([^\s>]+)\s*>\}\}", prose_only(source.read_text())):
                  path = (source.parent / included.strip("\"'")).resolve()
                  assert path.exists(), f"broken local include in {source}: {included}"
                  include_contexts.setdefault(path, set()).add(source.parent)

          for source in map(Path, tracked):
              for target in re.findall(r"\[[^]]+\]\(([^)]+)\)", prose_only(source.read_text())):
                  if "://" in target or target.startswith(("#", "mailto:")):
                      continue
                  relative = target.split("#", 1)[0].strip("<>")
                  if not relative:
                      continue
                  for context in include_contexts.get(source.resolve(), {source.parent}):
                      path = (
                          Path(relative.removeprefix("/"))
                          if relative.startswith("/")
                          else context / relative
                      ).resolve()
                      assert path.exists(), f"broken local link in {source}: {target}"
          print("verified local links in", len(tracked), "tracked Markdown/QMD files")
          PY
          if git ls-files | grep -Eq '(^|/)(_site|\.quarto|\.venv[^/]*|build|dist)(/|$)|\.quarto_ipynb$'; then
            echo "generated output is tracked"
            exit 1
          fi

      - name: Retain the source distribution
        uses: actions/upload-artifact@v4
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  native-platform-wheels:
    needs: change-scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.change-scope.outputs.lane == 'product'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-cp312-manylinux_2_28-x86_64
          - os: macos-15
            artifact: macos-cp312-macosx_12_0-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Build and audit CP312 manylinux_2_28 x86_64 wheel
        if: runner.os == 'Linux'
        run: |
          mkdir -p native-wheelhouse
          docker run --rm -v "$PWD:/io" -w /io quay.io/pypa/manylinux_2_28_x86_64 /bin/bash -euxc '
            /opt/python/cp312-cp312/bin/python -m pip install uv==0.12.6 auditwheel
            /opt/python/cp312-cp312/bin/python -m uv build --no-sources --python /opt/python/cp312-cp312/bin/python --out-dir /io/native-unrepaired
            mkdir -p /io/native-wheelhouse
            auditwheel show /io/native-unrepaired/*.whl > /io/native-wheelhouse/ABI-AUDIT.txt
            auditwheel repair --plat manylinux_2_28_x86_64 --wheel-dir /io/native-wheelhouse /io/native-unrepaired/*.whl
            /opt/python/cp312-cp312/bin/python -m pip freeze > /io/native-wheelhouse/BUILD-TOOLS.txt
            getconf GNU_LIBC_VERSION > /io/native-wheelhouse/BUILD-PLATFORM.txt
          '
      - name: Build native CP312 macOS12 Apple ARM wheel
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          ARCHFLAGS: "-arch arm64"
          _PYTHON_HOST_PLATFORM: "macosx-12.0-arm64"
        run: |
          uv run --no-project --python 3.12 python - <<'PYCODE'
          import platform
          assert platform.machine() == "arm64", platform.machine()
          PYCODE
          uv build --no-sources --python 3.12 --out-dir native-wheelhouse
          uname -m > native-wheelhouse/BUILD-PLATFORM.txt
          clang++ --version > native-wheelhouse/BUILD-TOOLS.txt
      - name: Verify exact native wheel tag and installed extension
        run: |
          uv venv --clear --python 3.12 .venv-native-wheel
          .venv-native-wheel/bin/python - <<'PYCODE'
          import glob, hashlib, json, platform, zipfile
          from pathlib import Path
          wheels = glob.glob("native-wheelhouse/*.whl")
          assert len(wheels) == 1, wheels
          expected = "cp312-cp312-manylinux_2_28_x86_64" if platform.system() == "Linux" else "cp312-cp312-macosx_12_0_arm64"
          # auditwheel may preserve a second equivalent Linux platform tag.
          assert expected in wheels[0] or (platform.system() == "Linux" and "manylinux_2_28_x86_64" in wheels[0] and "cp312-cp312" in wheels[0]), wheels[0]
          with zipfile.ZipFile(wheels[0]) as archive:
              assert not any(name.startswith("scnsim/_julia/") for name in archive.namelist()), archive.namelist()
              binaries = [name for name in archive.namelist() if name.startswith("scnsim/_native/_compensated_cpu") and name.endswith(".so")]
              assert len(binaries) == 1, binaries
              source = "scnsim/_native/compensated_cpu.cpp"
              source_bytes = archive.read(source)
              assert source_bytes == Path("src/scnsim/_native/compensated_cpu.cpp").read_bytes()
              resources = [{"path": name, "sha256": hashlib.sha256(archive.read(name)).hexdigest(), "bytes": len(archive.read(name))} for name in (source, *binaries)]
              record = next(name for name in archive.namelist() if name.endswith(".dist-info/RECORD"))
              binding = {"wheel": Path(wheels[0]).name, "wheel_sha256": hashlib.sha256(Path(wheels[0]).read_bytes()).hexdigest(), "platform": platform.system(), "machine": platform.machine(), "resources": resources, "record_sha256": hashlib.sha256(archive.read(record)).hexdigest()}
          Path("native-wheelhouse/NATIVE-RESOURCE-MANIFEST.json").write_text(json.dumps(binding, indent=2) + "\n")
          PYCODE
          uv pip install --python .venv-native-wheel/bin/python native-wheelhouse/*.whl
          .venv-native-wheel/bin/python - <<'PYCODE'
          import platform
          from scnsim._native import _compensated_cpu
          assert callable(_compensated_cpu.csr_pair_product)
          print(platform.machine(), _compensated_cpu.__file__)
          PYCODE
          if [ "$RUNNER_OS" = macOS ]; then
            file .venv-native-wheel/lib/python3.12/site-packages/scnsim/_native/*.so
            otool -l .venv-native-wheel/lib/python3.12/site-packages/scnsim/_native/*.so > native-wheelhouse/MACHO-LOAD-COMMANDS.txt
            .venv-native-wheel/bin/python - <<'PYCODE'
          import glob, re, subprocess
          binary, = glob.glob(".venv-native-wheel/lib/python3.12/site-packages/scnsim/_native/*.so")
          assert subprocess.check_output(["lipo", "-archs", binary], text=True).strip() == "arm64"
          commands = subprocess.check_output(["otool", "-l", binary], text=True)
          # LC_BUILD_VERSION minos or older LC_VERSION_MIN_MACOSX version.
          minima = re.findall(r"minos\s+(\d+\.\d+(?:\.\d+)?)", commands)
          if not minima:
              minima = re.findall(r"cmd LC_VERSION_MIN_MACOSX\s+cmdsize \d+\s+version (\d+\.\d+(?:\.\d+)?)", commands)
          assert len(minima) == 1 and tuple(map(int, minima[0].split('.')))[:2] == (12, 0), minima
          PYCODE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: native-wheelhouse/

  windows-native-wheel:
    needs: change-scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.change-scope.outputs.lane == 'product'
    runs-on: windows-2022
    steps:
      - name: Preserve Git source bytes in the Windows checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Build actual CP312 Windows AMD64 wheel with strict MSVC arithmetic
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-wheelhouse | Out-Null
          uv build --no-sources --wheel --python 3.12 --verbose --out-dir native-wheelhouse *> native-wheelhouse/BUILD.log
          if ($LASTEXITCODE -ne 0) { Get-Content native-wheelhouse/BUILD.log; exit $LASTEXITCODE }
          Get-Content native-wheelhouse/BUILD.log
          uv run --no-project --python 3.12 python scripts/ci_windows_wheel.py audit --wheelhouse native-wheelhouse --source-cpp src/scnsim/_native/compensated_cpu.cpp --build-log native-wheelhouse/BUILD.log --output native-wheelhouse/NATIVE-RESOURCE-MANIFEST.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cp312-win_amd64
          path: |
            native-wheelhouse/*.whl
            native-wheelhouse/*.json
            native-wheelhouse/*.txt
            native-wheelhouse/*.log
          if-no-files-found: error

  windows-jax-wheel-smoke:
    needs: [change-scope, windows-native-wheel]
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.change-scope.outputs.lane == 'product'
    runs-on: windows-2022
    steps:
      - name: Preserve Git source bytes in the Windows checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: windows-cp312-win_amd64
          path: native-wheelhouse
      - name: Sync an isolated consumer from the actual SCNSim wheel
        shell: pwsh
        run: |
          $repository = $PWD.Path
          $consumer = Join-Path $env:RUNNER_TEMP 'SCNSim consumer 空間'
          $environment = Join-Path $repository '.venv-windows-wheel'
          $wheelhouse = Join-Path $repository 'native-wheelhouse'
          $output = Join-Path $repository 'windows-observations/consumer-install'
          uv run --no-project --python 3.12 python scripts/ci_windows_wheel.py sync-consumer --consumer $consumer --environment $environment --wheelhouse $wheelhouse --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe installed native kernel and public Workspace and memory JAX usage
        shell: pwsh
        run: |
          $repository = $PWD.Path
          $python = Join-Path $repository '.venv-windows-wheel/Scripts/python.exe'
          $script = Join-Path $repository 'scripts/ci_windows_wheel.py'
          $chapter = Join-Path $repository 'examples/engineer/chapter-02/_01-build.qmd'
          $wheelhouse = Join-Path $repository 'native-wheelhouse'
          $output = Join-Path $repository 'windows-observations/PUBLIC-JAX.json'
          Set-Location $env:RUNNER_TEMP
          & $python $script smoke --repository $repository --chapter $chapter --wheelhouse $wheelhouse --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Discover the current purpose-based suite with the installed Windows wheel
        shell: pwsh
        run: |
          $repository = $PWD.Path
          $python = Join-Path $repository '.venv-windows-wheel/Scripts/python.exe'
          $requirements = Join-Path $env:RUNNER_TEMP 'scnsim-course-generation-requirements.txt'
          uv export --locked --no-default-groups --group course-generation --no-emit-project --format requirements-txt --output-file $requirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python $python -r $requirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m unittest discover -s tests -t . -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check installed wheel Path Portability Set on Windows
        shell: pwsh
        env:
          SCNSIM_PATH_TEST_CONTEXT: installed-wheel
        run: |
          $repository = $env:GITHUB_WORKSPACE
          $python = Join-Path $repository '.venv-windows-wheel/Scripts/python.exe'
          $test = Join-Path $repository 'tests/test_path_portability.py'
          Set-Location $env:RUNNER_TEMP
          & $python -W error::ResourceWarning $test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cp312-jax-observations
          path: windows-observations/
          if-no-files-found: error

  runtime-preparation-smoke:
    needs: [change-scope, native-platform-wheels]
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.change-scope.outputs.lane == 'product'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ runner.os == 'Linux' && 'linux-cp312-manylinux_2_28-x86_64' || 'macos-cp312-macosx_12_0-arm64' }}
          path: native-wheelhouse
      - name: Observe installed same-process JAX CPU operations and workpool
        run: |
          uv venv --clear --python 3.12 .venv-jax-wheel
          uv pip install --python .venv-jax-wheel/bin/python native-wheelhouse/*.whl
          for count in 1 32; do
            SCNSIM_CI_CPU_THREADS="$count" .venv-jax-wheel/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          from tempfile import TemporaryDirectory
          from importlib.metadata import version
          import scnsim
          from scnsim import CircuitRun, DirectSolveSpec, DiagonalRootSpec, ReductionPipeline, configure_runtime, units as u
          from examples.tutorials.fixtures.primitive_resonator import build_primitive_resonator

          launches = []
          def observe(event, args):
              if event == "subprocess.Popen":
                  executable, argv = args[0], args[1]
                  launches.append({"executable": str(executable), "argv": str(argv)})
                  if "julia" in Path(str(executable)).name.lower():
                      raise RuntimeError("Julia executable denied for the JAX observation")
          sys.addaudithook(observe)
          configuration = configure_runtime(cpu_threads=int(os.environ["SCNSIM_CI_CPU_THREADS"]))
          fixture = build_primitive_resonator()
          with TemporaryDirectory() as workspace:
              run = CircuitRun(plan=fixture.plan, workspace=workspace)
              observations = []
              for precision in ("float64", "float32"):
                  for frequencies in ([5.5, 6.0, 6.5], [5.6, 6.1, 6.6]):
                      spec = DirectSolveSpec(frequencies=frequencies * u.GHz)
                      result = run.solve(run.original, spec, precision=precision)
                      assert run.resolve(run.original, spec, precision=precision).identity == result.identity
                      observations.append({"precision": precision, "request": result.identity.request_sha256,
                                           "s": str(result.s.view.matrix)})
                  view = run.original.reduce(ReductionPipeline().retain(fixture.resonator_node))
                  root = run.evaluate(view, DiagonalRootSpec(coordinate=fixture.resonator_node, root_hint=6.0*u.GHz), precision=precision)
                  observations.append({"precision": precision, "frequency": str(root.frequency), "linewidth": str(root.linewidth)})
              trace = run.benchmark().document()
          assert "juliapkg" not in sys.modules
          # This is a coarse process-wide thread observation, not an inferred
          # exact PJRT-worker count or an affinity/pool-size acceptance threshold.
          if platform.system() == "Darwin":
              threads = subprocess.check_output(["ps", "-M", "-p", str(os.getpid())], text=True)
          else:
              threads = subprocess.check_output(["ps", "-o", "nlwp=", "-p", str(os.getpid())], text=True)
          print(json.dumps({"python": sys.version, "module": scnsim.__file__, "version": version("scnsim"),
                            "jax": version("jax"), "jaxlib": version("jaxlib"),
                            "requested_cpu_threads": configuration.cpu_threads, "PJRT_NPROC": os.environ.get("PJRT_NPROC"),
                            "process_thread_observation": threads, "launches": launches,
                            "numerical_observations": observations, "operation_record": trace}, default=str))
          PY
          done

      - name: Observe installed platform wheel JVP VJP CMA and exact readonly resolve
        run: |
          .venv-jax-wheel/bin/python - <<'PY'
          import json, platform, re, sys
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from scnsim import (CircuitRun, DiagonalRootSpec, ReductionPipeline,
              SensitivitySpec, JVP, VJP, OutputCoordinate, configure_runtime,
              OptimizationSpec, OptimizationVariable, CostObjective, CMAESSpec,
              ParameterSet, units as u)

          configure_runtime(cpu_threads=10)
          # Reuse the authored Chapter 2 construction cells, without its display layer.
          source = Path("examples/engineer/chapter-02/_01-build.qmd")
          blocks = re.findall(r"```\{python\}\n(.*?)\n```", source.read_text(), re.S)
          wanted = ("ch2-import-and-define-parameters", "ch2-build-grounded-lc-child", "ch2-assemble-coupler-and-port")
          namespace = {}
          for cell_id in wanted:
              block, = [block for block in blocks if f"#| id: {cell_id}" in block]
              block = block.replace("from IPython.display import display\n", "")
              exec(compile(block, str(source) + ':' + cell_id, 'exec'), namespace)
          capacitance, inductance = namespace['capacitance'], namespace['inductance']
          with TemporaryDirectory() as workspace:
              run = CircuitRun(plan=namespace['plan'], workspace=workspace)
              view = run.original.reduce(ReductionPipeline().retain(namespace['resonator_coordinate']))
              root = DiagonalRootSpec(coordinate=namespace['resonator_coordinate'], root_hint=6.0*u.GHz)
              quantities = {'frequency': root.frequency.on(view)}
              observations = []
              retained_projections = []
              for derivative in (JVP(direction={capacitance: 1.0*u.fF}),
                                 VJP(weights={OutputCoordinate('frequency'): 1.0/u.Hz})):
                  spec = SensitivitySpec(quantities=quantities, wrt=(capacitance,), derivative=derivative)
                  result = run.sensitivity(spec, precision='float64')
                  saved = run.resolve(spec, precision='float64')
                  assert saved.identity == result.identity
                  projection = saved.jvp if isinstance(derivative, JVP) else saved.vjp
                  block = projection.block(projection.block_ids[0])
                  retained_projections.append(projection)
                  observations.append({'derivative': type(derivative).__name__, 'identity': str(result.identity),
                      'block_id': block.block_id, 'status': block.status, 'failure': block.failure,
                      'saved_value': str(block.value) if isinstance(derivative, JVP) else str(block.values),
                      'units': str(block.value.units) if isinstance(derivative, JVP) and block.value is not None else getattr(block, 'units', None)})
              spec = OptimizationSpec(variables=(OptimizationVariable(parameter=capacitance,
                  bounds=(80.0*u.fF, 140.0*u.fF)),), objectives=(CostObjective(id='resonance_frequency',
                  quantity=root.frequency, target=6.2*u.GHz, weight=1.0*u.dimensionless),),
                  optimizer=CMAESSpec(seed=17, population_size=6, max_evaluations=7))
              parameters = ParameterSet({inductance: 5.8*u.nH})
              optimization = run.optimize(view, spec, parameters=parameters, precision='float64', progress=False)
              saved = run.resolve(view, spec, parameters=parameters, precision='float64')
              assert saved.identity == optimization.identity
              benchmark = run.benchmark().document()
              run.close()
              for projection in retained_projections:
                  block = projection.block(projection.block_ids[0])
                  observations.append({'after_close_block_id': block.block_id, 'status': block.status,
                      'failure': block.failure, 'value': str(getattr(block, 'value', None)),
                      'values': str(getattr(block, 'values', None)), 'units': getattr(block, 'units', None)})
              observations.append({'optimization_identity': str(saved.identity), 'after_close_best_cost': str(saved.best.cost)})
              print(json.dumps({'platform': platform.platform(), 'machine': platform.machine(),
                  'python': sys.version, 'observations': observations, 'benchmark': benchmark}, default=str))
          PY

      - name: Discover the current purpose-based suite with the installed platform wheel
        run: |
          requirements="$RUNNER_TEMP/scnsim-course-generation-requirements.txt"
          uv export --locked --no-default-groups --group course-generation --no-emit-project \
            --format requirements-txt --output-file "$requirements"
          uv pip install --python .venv-jax-wheel/bin/python -r "$requirements"
          .venv-jax-wheel/bin/python -m unittest discover -s tests -t . -v

      - name: Check installed wheel Path Portability Set on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          SCNSIM_PATH_TEST_CONTEXT: installed-wheel
        run: |
          repository="$GITHUB_WORKSPACE"
          python="$repository/.venv-jax-wheel/bin/python"
          test="$repository/tests/test_path_portability.py"
          cd "$RUNNER_TEMP"
          "$python" -W error::ResourceWarning "$test"

      - name: Check installed wheel Path Portability Set on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          SCNSIM_PATH_TEST_CONTEXT: installed-wheel
        run: |
          repository="$GITHUB_WORKSPACE"
          python="$repository/.venv-jax-wheel/bin/python"
          test="$repository/tests/test_path_portability.py"
          cd "$RUNNER_TEMP"
          "$python" -W error::ResourceWarning "$test"

  documentation:
    needs: change-scope
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && needs.change-scope.outputs.lane == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.12"
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.10.18"
      - name: Sync locked dependencies without building the project
        run: |
          uv lock --check
          uv sync --locked --no-install-project --no-build
      - name: Render and inspect documentation
        run: |
          quarto render --no-execute --no-clean
          uv run --locked --no-sync python - <<'PY'
          import re
          from pathlib import Path

          import subprocess

          tracked = subprocess.check_output(
              ["git", "ls-files", "*.md", "*.qmd"],
              text=True,
          ).splitlines()

          def prose_only(text):
              lines = []
              fence_char = None
              fence_length = 0
              for line in text.splitlines():
                  marker = re.match(r"^ {0,3}(`{3,}|~{3,})(.*)$", line)
                  if fence_char is None:
                      if marker:
                          fence_char = marker.group(1)[0]
                          fence_length = len(marker.group(1))
                      else:
                          lines.append(line)
                  elif (
                      marker
                      and marker.group(1)[0] == fence_char
                      and len(marker.group(1)) >= fence_length
                      and not marker.group(2).strip()
                  ):
                      fence_char = None
              return "\n".join(lines)

          include_contexts = {}
          for source in map(Path, tracked):
              for included in re.findall(r"\{\{<\s*include\s+([^\s>]+)\s*>\}\}", prose_only(source.read_text())):
                  path = (source.parent / included.strip("\"'")).resolve()
                  assert path.exists(), f"broken local include in {source}: {included}"
                  include_contexts.setdefault(path, set()).add(source.parent)

          for source in map(Path, tracked):
              for target in re.findall(r"\[[^]]+\]\(([^)]+)\)", prose_only(source.read_text())):
                  if "://" in target or target.startswith(("#", "mailto:")):
                      continue
                  relative = target.split("#", 1)[0].strip("<>")
                  if not relative:
                      continue
                  for context in include_contexts.get(source.resolve(), {source.parent}):
                      path = (
                          Path(relative.removeprefix("/"))
                          if relative.startswith("/")
                          else context / relative
                      ).resolve()
                      assert path.exists(), f"broken local link in {source}: {target}"
          print("verified local links in", len(tracked), "tracked Markdown/QMD files")
          PY
          if git ls-files | grep -Eq '(^|/)(_site|\.quarto|\.venv[^/]*|build|dist)(/|$)|\.quarto_ipynb$'; then
            echo "generated output is tracked"
            exit 1
          fi

  ci-status:
    needs:
      - change-scope
      - package-and-docs
      - native-platform-wheels
      - windows-native-wheel
      - windows-jax-wheel-smoke
      - runtime-preparation-smoke
      - documentation
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the declared lane to finish successfully
        env:
          LANE: ${{ needs.change-scope.outputs.lane }}
          CLASSIFIER: ${{ needs.change-scope.result }}
          PACKAGE: ${{ needs.package-and-docs.result }}
          NATIVE: ${{ needs.native-platform-wheels.result }}
          WINDOWS: ${{ needs.windows-native-wheel.result }}
          WINDOWS_SMOKE: ${{ needs.windows-jax-wheel-smoke.result }}
          RUNTIME: ${{ needs.runtime-preparation-smoke.result }}
          DOCS: ${{ needs.documentation.result }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          python - <<'PY'
          import os
          import sys

          statuses = {
              "package-and-docs": os.environ["PACKAGE"],
              "native-platform-wheels": os.environ["NATIVE"],
              "windows-native-wheel": os.environ["WINDOWS"],
              "windows-jax-wheel-smoke": os.environ["WINDOWS_SMOKE"],
              "runtime-preparation-smoke": os.environ["RUNTIME"],
          }
          docs = os.environ["DOCS"]
          event = os.environ["EVENT"]
          draft = os.environ["DRAFT"] == "true"
          lane = os.environ["LANE"]
          if os.environ["CLASSIFIER"] != "success":
              sys.exit("change classifier did not succeed")
          if lane not in {"docs", "product"}:
              sys.exit("classifier returned an invalid lane")
          if event == "pull_request" and draft:
              if any(result != "skipped" for result in statuses.values()) or docs != "skipped":
                  sys.exit("draft PR unexpectedly ran or failed a lane")
          elif lane == "docs":
              if docs != "success" or any(result != "skipped" for result in statuses.values()):
                  sys.exit("documentation lane did not finish as declared")
          elif lane == "product":
              if docs != "skipped" or any(result != "success" for result in statuses.values()):
                  sys.exit("product lane did not finish as declared")
          else:
              sys.exit("classifier returned an invalid lane")
          PY
