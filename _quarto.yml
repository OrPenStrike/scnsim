    - examples/tutorials/06_create_library.qmd
    - examples/tutorials/07_add_composite_factory.qmd
    - examples/tutorials/08_use_custom_component.qmd
    - examples/tutorials/09_model_n_trace_line.qmd
    - examples/tutorials/10_compensate_probes.qmd
    - examples/tutorials/11_transform_retain.qmd
    - examples/tutorials/12_prepare_hb.qmd
    - examples/tutorials/13_compare_direct_hb.qmd
    - docs/concepts/physical-authority-and-reusable-composition.qmd
    - docs/concepts/compilation-coordinates-and-network-views.qmd
    - docs/concepts/requests-execution-and-result-ownership.qmd
    - docs/concepts/direct-and-hb-realizations.qmd
    - docs/concepts/units-parameters-and-optimization.qmd
    - docs/contracts/index.qmd
    - docs/component-authoring.qmd
    - docs/v1-runtime-contract.qmd
    - docs/implementation/system-architecture.qmd
    - docs/implementation/plan-sealing-and-identity.qmd
    - docs/implementation/canonical-identities-and-schemas.qmd
    - docs/implementation/catalog-and-runtime-identity.qmd
    - docs/implementation/julia-runtime-preparation.qmd
    - docs/implementation/python-julia-protocol.qmd
    - docs/implementation/workspace-attempts-and-artifacts.qmd
    - docs/implementation/composite-snapshots-and-recursive-expansion.qmd
    - docs/implementation/compilation-ports-and-views.qmd
    - docs/implementation/rlgc-q2d-and-pi-expansion.qmd
    - docs/implementation/view-lineage-and-selected-networks.qmd
    - docs/implementation/diagonal-root-numerical-procedure.qmd
