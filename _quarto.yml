website:
  title: "SCNSim"
  description: "Superconducting Circuit Network Simulation"
  page-navigation: true
  reader-mode: true
  search: true
  repo-url: "https://github.com/OrPenStrike/scnsim"
  repo-actions: [source, issue]
  navbar:
    left:
      - text: "Overview"
        href: README.md
      - text: "Tutorial"
        href: docs/index.qmd
      - text: "Concept"
        href: docs/concepts/physical-authority-and-reusable-composition.qmd
      - text: "Contract"
        href: docs/contracts/index.qmd
  sidebar:
    - id: overview
      title: "Overview"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Repository overview"
          href: README.md
    - id: tutorial
      title: "Tutorial"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Course map"
          href: docs/index.qmd
        - section: "Build a circuit and get a result"
          contents:
            - text: "Chapter 1 — Model a coupled grounded resonator"
              href: examples/tutorials/01_author_primitive.qmd
            - text: "Chapter 2 — Ask for a Direct response"
              href: examples/tutorials/02_solve_direct.qmd
            - text: "Chapter 3 — Select a coordinate and evaluate"
              href: examples/tutorials/03_evaluate_quantity.qmd
        - section: "Define inputs, sweep, tune, and recover"
          contents:
            - text: "Chapter 4 — Define and bind physical parameters"
              href: examples/tutorials/04_define_parameters.qmd
            - text: "Chapter 5 — Sweep parameter points"
              href: examples/tutorials/05_sweep_parameters.qmd
            - text: "Chapter 6 — Tune a physical parameter"
              href: examples/tutorials/06_optimize_primitive.qmd
            - text: "Chapter 7 — Report and resolve exact requests"
              href: examples/tutorials/07_report_resolve.qmd
        - section: "Reuse circuits and review diagrams"
          contents:
            - text: "Chapter 8 — Start a reusable Library"
              href: examples/tutorials/08_create_library.qmd
            - text: "Chapter 9 — Build a Composite factory"
              href: examples/tutorials/09_add_composite_factory.qmd
            - text: "Chapter 10 — Reuse a component in a circuit"
              href: examples/tutorials/10_use_custom_component.qmd
            - text: "Chapter 11 — Review and customize a schematic"
              href: examples/tutorials/11_review_customize_schematic.qmd
        - section: "Model and analyze coupled systems"
          contents:
            - text: "Chapter 12 — Model ordered RLGC lines"
              href: examples/tutorials/12_model_n_trace_line.qmd
            - text: "Chapter 13 — Assemble the capstone and compensate its probes"
              href: examples/tutorials/13_compensate_probes.qmd
            - text: "Chapter 14 — Transform and retain coordinates"
              href: examples/tutorials/14_transform_retain.qmd
            - text: "Chapter 15 — Prepare pump-off HB"
              href: examples/tutorials/15_prepare_hb.qmd
            - text: "Chapter 16 — Read Direct and pump-off HB"
              href: examples/tutorials/16_compare_direct_hb.qmd
    - id: concept
      title: "Concept"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Physical authority and composition"
          href: docs/concepts/physical-authority-and-reusable-composition.qmd
        - text: "Compilation, coordinates, and views"
          href: docs/concepts/compilation-coordinates-and-network-views.qmd
        - text: "Requests, execution, and Results"
          href: docs/concepts/requests-execution-and-result-ownership.qmd
        - text: "Direct and HB realizations"
          href: docs/concepts/direct-and-hb-realizations.qmd
        - text: "Units, parameters, and optimization"
          href: docs/concepts/units-parameters-and-optimization.qmd
    - id: contract
      title: "Contract"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Contract map"
          href: docs/contracts/index.qmd
        - section: "Public contracts"
          contents:
            - text: "Component Authoring Contract"
              href: docs/component-authoring.qmd
            - text: "Automatic Semantic Circuit Diagram Layout"
              href: docs/contracts/automatic-semantic-circuit-diagram-layout.qmd
            - text: "Parameter System"
              href: docs/contracts/parameter-system.qmd
            - text: "V1 Runtime Contract"
              href: docs/v1-runtime-contract.qmd
        - section: "Implementation design"
          contents:
            - text: "System architecture and ownership"
              href: docs/implementation/system-architecture.qmd
            - text: "Plan sealing and identity"
              href: docs/implementation/plan-sealing-and-identity.qmd
            - text: "Canonical identities and schemas"
              href: docs/implementation/canonical-identities-and-schemas.qmd
            - text: "Catalog and runtime identity"
              href: docs/implementation/catalog-and-runtime-identity.qmd
            - text: "Julia runtime preparation"
              href: docs/implementation/julia-runtime-preparation.qmd
            - text: "Python–Julia process protocol"
              href: docs/implementation/python-julia-protocol.qmd
            - text: "Workspace, attempts, and artifacts"
              href: docs/implementation/workspace-attempts-and-artifacts.qmd
            - text: "Composite snapshots and recursive expansion"
              href: docs/implementation/composite-snapshots-and-recursive-expansion.qmd
            - text: "Compilation, Ports, and views"
              href: docs/implementation/compilation-ports-and-views.qmd
            - text: "RLGC, Q2D, and pi expansion"
              href: docs/implementation/rlgc-q2d-and-pi-expansion.qmd
            - text: "View lineage and selected networks"
              href: docs/implementation/view-lineage-and-selected-networks.qmd
            - text: "Diagonal-root numerical procedure"
              href: docs/implementation/diagonal-root-numerical-procedure.qmd
            - text: "Direct poles, zeros, couplings, and operators"
              href: docs/implementation/direct-poles-zeros-and-operators.qmd
            - text: "Direct quantities and optimization"
              href: docs/implementation/direct-quantities-and-optimization.qmd
            - text: "HB realization and outcomes"
              href: docs/implementation/hb-realization-and-outcomes.qmd
            - text: "Results, reports, and diagrams"
              href: docs/implementation/results-reports-and-diagrams.qmd
            - text: "External inputs and delivery"
              href: docs/implementation/external-inputs-and-delivery.qmd

format:
  html:
    theme:
      light: [cosmo, docs/theme-light.scss]
      dark: [cosmo, docs/theme-dark.scss]
    css: docs/styles.css
    html-math-method: mathjax
    respect-user-color-scheme: true
    toc: true
    page-layout: article
    grid:
      sidebar-width: 260px
      body-width: 960px
      margin-width: 240px
      gutter-width: 2.5rem
    code-copy: true
