website:
  title: "SCNSim"
  description: "Superconducting Circuit Network Simulation"
  page-navigation: true
  reader-mode: true
  search: true
  repo-url: "https://github.com/OrPenStrike/scnsim"
  repo-actions: [source, issue]
  navbar:
    left:
      - text: "Overview"
        href: README.md
      - text: "Tutorial"
        href: docs/index.qmd
      - text: "Concept"
        href: docs/concepts/physical-authority-and-reusable-composition.qmd
      - text: "Contract"
        href: docs/contracts/index.qmd
  sidebar:
    - id: overview
      title: "Overview"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Repository overview"
          href: README.md
    - id: tutorial
      title: "Engineer Course"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Course map"
          href: docs/index.qmd
        - section: "Chapter 1 — Coupled grounded LC"
          contents:
            - text: "Lesson 1 — Build"
              href: examples/engineer/chapter-01/01-build.qmd
            - text: "Lesson 2 — Diagram"
              href: examples/engineer/chapter-01/02-diagram.qmd
            - text: "Lesson 3 — S11"
              href: examples/engineer/chapter-01/03-s11.qmd
            - text: "Lesson 4 — Loaded root"
              href: examples/engineer/chapter-01/04-root.qmd
            - text: "Lesson 5 — Change capacitance"
              href: examples/engineer/chapter-01/05-change-capacitance.qmd
            - text: "Complete Chapter source"
              href: examples/engineer/chapter-01/chapter.qmd
        - section: "Migration legacy"
          contents:
            - text: "01 — Author primitive"
              href: examples/tutorials/01_author_primitive.qmd
            - text: "02 — Solve Direct"
              href: examples/tutorials/02_solve_direct.qmd
            - text: "03 — Evaluate quantity"
              href: examples/tutorials/03_evaluate_quantity.qmd
            - text: "04 — Define parameters"
              href: examples/tutorials/04_define_parameters.qmd
            - text: "05 — Sweep parameters"
              href: examples/tutorials/05_sweep_parameters.qmd
            - text: "06 — Optimize primitive"
              href: examples/tutorials/06_optimize_primitive.qmd
            - text: "07 — Report and resolve"
              href: examples/tutorials/07_report_resolve.qmd
            - text: "08 — Create Library"
              href: examples/tutorials/08_create_library.qmd
            - text: "09 — Add Composite factory"
              href: examples/tutorials/09_add_composite_factory.qmd
            - text: "10 — Use custom component"
              href: examples/tutorials/10_use_custom_component.qmd
            - text: "11 — Review schematic"
              href: examples/tutorials/11_review_customize_schematic.qmd
            - text: "12 — Model N-trace line"
              href: examples/tutorials/12_model_n_trace_line.qmd
            - text: "13 — Compensate probes"
              href: examples/tutorials/13_compensate_probes.qmd
