format:
  html:
    theme:
      light: [cosmo, docs/theme-light.scss]
      dark: [cosmo, docs/theme-dark.scss]
    css: docs/styles.css
    html-math-method: mathjax
    respect-user-color-scheme: true
    toc: true
    page-layout: article
    grid:
      sidebar-width: 260px
      body-width: 960px
      margin-width: 240px
      gutter-width: 2.5rem
    code-copy: true
