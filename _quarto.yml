project:
  type: website
  output-dir: _site
  render:
    - README.md
    - docs/index.qmd
    - examples/tutorials/01_author_primitive.qmd
    - examples/tutorials/02_solve_direct.qmd
    - examples/tutorials/03_evaluate_quantity.qmd
    - examples/tutorials/04_optimize_primitive.qmd
    - examples/tutorials/05_report_resolve.qmd
    - examples/tutorials/06_create_library.qmd
    - examples/tutorials/07_add_composite_factory.qmd
    - examples/tutorials/08_use_custom_component.qmd
    - examples/tutorials/09_model_n_trace_line.qmd
    - examples/tutorials/10_compensate_probes.qmd
    - examples/tutorials/11_transform_retain.qmd
    - examples/tutorials/12_prepare_hb.qmd
    - examples/tutorials/13_compare_direct_hb.qmd
    - docs/concepts/physical-authority-and-reusable-composition.qmd
    - docs/concepts/compilation-coordinates-and-network-views.qmd
    - docs/concepts/requests-execution-and-result-ownership.qmd
    - docs/concepts/direct-and-hb-realizations.qmd
    - docs/concepts/units-parameters-and-optimization.qmd
    - docs/component-authoring.qmd
    - docs/v1-runtime-contract.qmd

website:
  title: "SCNSim"
  description: "Superconducting Circuit Network Simulation"
  page-navigation: true
  reader-mode: true
  search: true
  repo-url: "https://github.com/OrPenStrike/scnsim"
  repo-actions: [source, issue]
  navbar:
    left:
      - text: "Overview"
        href: README.md
      - text: "Tutorial"
        href: docs/index.qmd
      - text: "Concept"
        href: docs/concepts/physical-authority-and-reusable-composition.qmd
      - text: "Contract"
        href: docs/component-authoring.qmd
  sidebar:
    - id: overview
      title: "Overview"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Repository overview"
          href: README.md
    - id: tutorial
      title: "Tutorial"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Course map"
          href: docs/index.qmd
        - section: "Author and analyze"
          contents:
            - text: "1. Author a primitive circuit"
              href: examples/tutorials/01_author_primitive.qmd
            - text: "2. Prepare and solve Direct"
              href: examples/tutorials/02_solve_direct.qmd
            - text: "3. Evaluate a loaded resonance"
              href: examples/tutorials/03_evaluate_quantity.qmd
            - text: "4. Tune and verify a resonance"
              href: examples/tutorials/04_optimize_primitive.qmd
            - text: "5. Report and resolve"
              href: examples/tutorials/05_report_resolve.qmd
        - section: "Reusable composition"
          contents:
            - text: "6. Create a custom Library"
              href: examples/tutorials/06_create_library.qmd
            - text: "7. Add a Composite factory"
              href: examples/tutorials/07_add_composite_factory.qmd
            - text: "8. Use a custom component"
              href: examples/tutorials/08_use_custom_component.qmd
        - section: "Advanced native workflows"
          contents:
            - text: "9. Model an N-trace line"
              href: examples/tutorials/09_model_n_trace_line.qmd
            - text: "10. Compensate probes"
              href: examples/tutorials/10_compensate_probes.qmd
            - text: "11. Transform coordinates"
              href: examples/tutorials/11_transform_retain.qmd
            - text: "12. Prepare pump-off HB"
              href: examples/tutorials/12_prepare_hb.qmd
            - text: "13. Compare Direct/HB"
              href: examples/tutorials/13_compare_direct_hb.qmd
    - id: concept
      title: "Concept"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Physical authority and composition"
          href: docs/concepts/physical-authority-and-reusable-composition.qmd
        - text: "Compilation, coordinates, and views"
          href: docs/concepts/compilation-coordinates-and-network-views.qmd
        - text: "Requests, execution, and Results"
          href: docs/concepts/requests-execution-and-result-ownership.qmd
        - text: "Direct and HB realizations"
          href: docs/concepts/direct-and-hb-realizations.qmd
        - text: "Units, parameters, and optimization"
          href: docs/concepts/units-parameters-and-optimization.qmd
    - id: contract
      title: "Contract"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Component Authoring Contract"
          href: docs/component-authoring.qmd
        - text: "V1 Runtime Contract"
          href: docs/v1-runtime-contract.qmd

format:
  html:
    theme:
      light: [cosmo, docs/theme-light.scss]
      dark: [cosmo, docs/theme-dark.scss]
    css: docs/styles.css
    html-math-method: mathjax
    respect-user-color-scheme: true
    toc: true
    page-layout: article
    grid:
      sidebar-width: 260px
      body-width: 960px
      margin-width: 240px
      gutter-width: 2.5rem
    code-copy: true
