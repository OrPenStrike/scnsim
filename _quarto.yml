project:
  type: website
  output-dir: _site
  render:
    - README.md
    - docs/index.qmd
    - examples/simple_resonator/01_model_author.qmd
    - examples/reusable_composite/01_composite_plan.qmd
    - examples/simple_resonator/02_model_user.qmd
    - examples/ipf_optimization/01_model_author.qmd
    - examples/ipf_optimization/02_model_user.qmd
    - docs/concepts/physical-authority-and-reusable-composition.qmd
    - docs/concepts/compilation-coordinates-and-network-views.qmd
    - docs/concepts/requests-execution-and-result-ownership.qmd
    - docs/concepts/direct-and-hb-realizations.qmd
    - docs/concepts/units-parameters-and-optimization.qmd
    - docs/component-authoring.qmd
    - docs/v1-runtime-contract.qmd

website:
  title: "SCNSim"
  description: "Superconducting Circuit Network Simulation"
  page-navigation: true
  reader-mode: true
  search: true
  repo-url: "https://github.com/OrPenStrike/scnsim"
  repo-actions: [source, issue]
  navbar:
    left:
      - text: "Overview"
        href: README.md
      - text: "Tutorial"
        href: docs/index.qmd
      - text: "Concept"
        href: docs/concepts/physical-authority-and-reusable-composition.qmd
      - text: "Contract"
        href: docs/component-authoring.qmd
  sidebar:
    - id: overview
      title: "Overview"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Repository overview"
          href: README.md
    - id: tutorial
      title: "Tutorial"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Course map"
          href: docs/index.qmd
        - text: "1. Build from primitives"
          href: examples/simple_resonator/01_model_author.qmd
        - text: "2. Package a Composite"
          href: examples/reusable_composite/01_composite_plan.qmd
        - text: "3. Publish a team model"
          href: examples/simple_resonator/02_model_user.qmd
        - text: "4. Author an IPF Composite"
          href: examples/ipf_optimization/01_model_author.qmd
        - text: "5. Optimize and reuse"
          href: examples/ipf_optimization/02_model_user.qmd
    - id: concept
      title: "Concept"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Physical authority and composition"
          href: docs/concepts/physical-authority-and-reusable-composition.qmd
        - text: "Compilation, coordinates, and views"
          href: docs/concepts/compilation-coordinates-and-network-views.qmd
        - text: "Requests, execution, and Results"
          href: docs/concepts/requests-execution-and-result-ownership.qmd
        - text: "Direct and HB realizations"
          href: docs/concepts/direct-and-hb-realizations.qmd
        - text: "Units, parameters, and optimization"
          href: docs/concepts/units-parameters-and-optimization.qmd
    - id: contract
      title: "Contract"
      style: "floating"
      collapse-level: 1
      contents:
        - text: "Component Authoring Contract"
          href: docs/component-authoring.qmd
        - text: "V1 Runtime Contract"
          href: docs/v1-runtime-contract.qmd

format:
  html:
    theme:
      light: [cosmo, docs/theme-light.scss]
      dark: [cosmo, docs/theme-dark.scss]
    css: docs/styles.css
    html-math-method: mathjax
    respect-user-color-scheme: true
    toc: true
    page-layout: article
    grid:
      sidebar-width: 260px
      body-width: 960px
      margin-width: 240px
      gutter-width: 2.5rem
    code-copy: true
