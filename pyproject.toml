[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scnsim"
version = "1.0.0a2"
description = "Superconducting Circuit Network Simulation."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "cmaes==0.13.1",
  "jax==0.11.2",
  "jaxlib==0.11.2",
  "matplotlib>=3.10.9,<3.11",
  "numpy>=2.2.6,<2.3",
  "pint>=0.24.4,<0.25",
  "plotly>=6.3,<7",
  "schemdraw>=0.23,<1",
  "zarr>=2.18.3,<3",
]

[project.urls]
Homepage = "https://github.com/OrPenStrike/scnsim"
Documentation = "https://orpenstrike.github.io/scnsim/"
Issues = "https://github.com/OrPenStrike/scnsim/issues"
Repository = "https://github.com/OrPenStrike/scnsim"

[project.optional-dependencies]
julia = [
    "juliapkg>=0.1.26,<0.2",
]
static-export = [
    "kaleido>=1,<2",
]

[dependency-groups]
course-generation = [
    "ipykernel>=7.3,<8",
    "jupyter-client>=8.10,<9",
    "nbformat>=5.10,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scnsim = [
  "py.typed",
  "_schemas/*.json",
  "_julia/*.toml",
  "_julia/*.json",
  "_julia/bin/*.jl",
  "_julia/src/*.jl",
]
