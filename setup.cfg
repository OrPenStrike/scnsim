[metadata]
name = scnsim
version = 1.0.0.dev1
description = Superconducting Circuit Network Simulation
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

[options.package_data]
scnsim = py.typed
